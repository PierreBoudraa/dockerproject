pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    client_max_body_size  1m;

    # DNS interne de Docker, re-résolu toutes les 10 s : l'upstream
    # survit à la recréation du conteneur API (nouvelle IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        # Santé locale du proxy (ne dépend pas de l'API)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            # Variable => nginx résout le nom à l'exécution, pas au démarrage
            set $api_upstream delivery-api:8000;
            proxy_pass http://$api_upstream;

            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_send_timeout    10s;
            proxy_read_timeout    30s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }
    }
}
