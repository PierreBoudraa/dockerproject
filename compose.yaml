name: docker-delivery

services:
  postgres:
    image: postgres:16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    # Exception documentee : rootfs en ecriture (initdb, socket Unix, fichiers de PGDATA).
    # Compensations : volume nomme, cap_drop ALL, no-new-privileges, uid 70, aucun port publie.
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - db-secret:/run/secrets:ro
      - ./db/init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200

  delivery-api:
    image: "${DELIVERY_API_IMAGE:?Set DELIVERY_API_IMAGE in .env}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0-dev}
        GIT_SHA: ${GIT_SHA:-local}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-course-lab}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - db-secret:/run/secrets:ro
    networks: [data, edge]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /readyz interroge PostgreSQL : la santé dépend de la base
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:8059701048a6cc7d64e8ab2812a44be70161bfa9ecfc01d69e95b8ff2a648705
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    ports:
      - "127.0.0.1:${COURSE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge]
    depends_on:
      delivery-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 50

networks:
  edge: {}                # proxy <-> API
  data:                   # API <-> PostgreSQL, sans accès extérieur
    internal: true

volumes:
  postgres-data:
    external: true
    name: td03-postgres-data
  db-secret:
    external: true
    name: td03-db-secret
